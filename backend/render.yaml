services:
  - type: web
    name: finflow-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false   # you fill this in the Render dashboard
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random string
      - key: ALLOWED_ORIGINS
        sync: false   # you fill this after you get your Vercel URL
