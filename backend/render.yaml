# FinFlow — Render.com Deployment Config
# Free tier: 750 hours/month, spins down after 15min inactivity
# Use cron-job.org to ping /ping every 14 minutes to keep it awake

services:
  - type: web
    name: finflow-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: OPENAI_API_KEY
        value: ""
      - key: LOG_LEVEL
        value: WARNING

databases:
  - name: finflow-db
    databaseName: finflow
    plan: free
