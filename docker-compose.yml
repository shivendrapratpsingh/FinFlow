version: "3.9"

# ================================================================
# FinFlow — Development Docker Compose
# Usage: docker-compose up --build
# ================================================================

services:

  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: finflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow_secret
      POSTGRES_DB: finflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finflow_net

  # ── Redis Cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finflow_net

  # ── Redis Commander (Dev UI) ─────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: finflow_redis_ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8001:8081"
    depends_on:
      - redis
    networks:
      - finflow_net

  # ── pgAdmin (Dev UI) ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finflow_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finflow.app
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - finflow_net

  # ── ChromaDB (Vector Store for AI) ───────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: finflow_chroma
    restart: unless-stopped
    ports:
      - "8008:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - finflow_net

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: finflow_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finflow:finflow_secret@postgres:5432/finflow_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - finflow_net

  # ── Celery Worker ────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: finflow_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finflow:finflow_secret@postgres:5432/finflow_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    networks:
      - finflow_net

  # ── Celery Beat (Scheduler) ──────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: finflow_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finflow:finflow_secret@postgres:5432/finflow_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - celery_worker
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - finflow_net

  # ── Next.js Frontend ─────────────────────────────────────────
  frontend:
    image: node:18-alpine
    container_name: finflow_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    networks:
      - finflow_net

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: finflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - finflow_net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  chroma_data:
  frontend_node_modules:
  frontend_next:

# ── Networks ─────────────────────────────────────────────────
networks:
  finflow_net:
    driver: bridge
