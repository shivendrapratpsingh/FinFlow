version: "3.9"

# ================================================================
# FinFlow — Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ================================================================

services:

  postgres:
    image: postgres:15-alpine
    container_name: finflow_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finflow_prod_net

  redis:
    image: redis:7-alpine
    container_name: finflow_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - finflow_prod_net

  chromadb:
    image: chromadb/chroma:latest
    container_name: finflow_chroma_prod
    restart: always
    volumes:
      - chroma_prod_data:/chroma/chroma
    networks:
      - finflow_prod_net

  backend:
    image: finflow/backend:${APP_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: finflow_backend_prod
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      gunicorn app.main:app
      -w 4
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - finflow_prod_net

  celery_worker:
    image: finflow/backend:${APP_VERSION:-latest}
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=8
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    networks:
      - finflow_prod_net

  frontend:
    image: finflow/frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: finflow_frontend_prod
    restart: always
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    networks:
      - finflow_prod_net

  nginx:
    image: nginx:alpine
    container_name: finflow_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - finflow_prod_net

volumes:
  postgres_prod_data:
  redis_prod_data:
  chroma_prod_data:
  nginx_logs:

networks:
  finflow_prod_net:
    driver: bridge
